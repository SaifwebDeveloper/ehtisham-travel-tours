<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#020617" />

    <meta name="color-scheme" content="dark" />

    <meta
      name="format-detection"
      content="telephone=yes"
    />

    <!-- SEO -->
    <title>
      Ehtisham Travel & Tours | Skardu, Hunza & Northern Pakistan Tours
    </title>

    <meta
      name="description"
      content="Ehtisham Travel & Tours offers professionally managed Skardu, Hunza, Neelam Valley, honeymoon, family, student, corporate and winter tours across Northern Pakistan."
    />

    <meta
      name="keywords"
      content="Ehtisham Travel & Tours, Skardu tours, Hunza tours, Neelam Valley tours, Northern Pakistan tours, Pakistan tourism, Pakistan travel, honeymoon tours Pakistan, family tours Pakistan, student tours Pakistan, winter tours Pakistan"
    />

    <meta
      name="author"
      content="Ehtisham Travel & Tours"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical -->
    <link rel="icon" type="image/jpeg" href="assets/ehtisham-logo.jpg">

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/jpeg"
      href="/assets/ehtisham-logo.jpg"
    />

    <link
      rel="apple-touch-icon"
      href="/assets/ehtisham-logo.jpg"
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://ahtishamtravel.vercel.app/"
    />

    <meta
      property="og:title"
      content="Ehtisham Travel & Tours | Northern Pakistan Tours"
    />

    <meta
      property="og:description"
      content="Explore professionally managed Skardu, Hunza, Neelam Valley, honeymoon, family, student and winter journeys across Northern Pakistan."
    />

    <meta
      property="og:image"
      content="https://ahtishamtravel.vercel.app/assets/ehtisham-logo.jpg"
    />

    <meta
      property="og:image:alt"
      content="Ehtisham Travel & Tours logo"
    />

    <meta
      property="og:site_name"
      content="Ehtisham Travel & Tours"
    />

    <meta
      property="og:locale"
      content="en_PK"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Ehtisham Travel & Tours | Northern Pakistan Tours"
    />

    <meta
      name="twitter:description"
      content="Professionally managed tours across Skardu, Hunza, Neelam Valley and Northern Pakistan."
    />

    <meta
      name="twitter:image"
      content="https://ahtishamtravel.vercel.app/assets/ehtisham-logo.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Ehtisham Travel & Tours logo"
    />

    <!-- Geographic SEO -->
    <meta
      name="geo.region"
      content="PK"
    />

    <meta
      name="geo.country"
      content="Pakistan"
    />

    <meta
      name="language"
      content="English"
    />

    <!-- Performance -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Ehtisham Travel & Tours",
        "description": "Professionally managed tours across Northern Pakistan including Skardu, Hunza and Neelam Valley.",
        "url": "https://ahtishamtravel.vercel.app/",
        "logo": "https://ahtishamtravel.vercel.app/assets/ehtisham-logo.jpg",
        "image": "https://ahtishamtravel.vercel.app/assets/ehtisham-logo.jpg",
        "telephone": "+923468860855",
        "sameAs": [
          "https://www.instagram.com/travel_with_ehtisham_"
        ],
        "areaServed": {
          "@type": "Country",
          "name": "Pakistan"
        },
        "knowsAbout": [
          "Skardu Tours",
          "Hunza Tours",
          "Neelam Valley Tours",
          "Northern Pakistan Tourism",
          "Honeymoon Tours",
          "Family Tours",
          "Student Tours",
          "Winter Tours"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
